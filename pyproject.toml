[project]
name = "lab4-ds"
version = "0.1.0"
description = "Reproducible Sentinel-2 cyanobacteria analysis for Lakes Atitlan and Amatitlan"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.0",
    "numpy>=2.5.2",
    "openeo>=0.51.0",
    "pandas>=2.3.3",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.2",
    "rasterio>=1.5.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sentinelhub>=3.11.5",
    "shap>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
lab4 = "lab4_ds.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab4_ds"]

[tool.uv]
# shap pins numba<0.63 / llvmlite<0.46 on Intel macOS. Resolving for that
# platform drags the whole lock down to llvmlite 0.36, which has no wheels
# and cannot build on Python 3.14. We don't target Intel macOS, so skip it.
environments = [
    "sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["Lab4.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
