[project]
name = "lab4-ds"
version = "0.1.0"
description = "Reproducible Sentinel-2 cyanobacteria analysis for Lakes Atitlan and Amatitlan"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openeo>=0.51.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "rasterio>=1.5.1",
    "sentinelhub>=3.11.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
lab4 = "lab4_ds.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab4_ds"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["Lab4.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
